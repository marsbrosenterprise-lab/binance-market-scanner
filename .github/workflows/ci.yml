name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scanner_test
          POSTGRES_USER: scanner
          POSTGRES_PASSWORD: scanner_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scanner -d scanner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run migrations against isolated PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://scanner:scanner_test_password@localhost:5432/scanner_test
        run: alembic upgrade head
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q
